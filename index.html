<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Musik Koffer – Workbench (Clean Black/White)</title>
  <style>
    :root {
      --pad:16px;
      --nav-w: clamp(220px, 22vw, 360px);
      --border:#000000;
      --bg:#ffffff;  /* Weiß */
      --text:#000000; /* Schwarz */
    }
    *{box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      margin:0;
      background:var(--bg);
      color:var(--text);
    }
    header{
      padding:12px var(--pad);
      border-bottom:1px solid var(--border);
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px;
      background:#fff;
      color:#000;
    }
    header h1{margin:0;font-size:1.35rem;flex:1}
    #status{font-size:.9rem;color:#000}
    #todoStats{display:flex;align-items:center;gap:0.5rem;width:100%;justify-content:flex-end;}
    #err{color:#b00020;margin-left:12px;display:none;white-space:pre-wrap}
    .toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;width:100%;}
    .badge{display:none;margin-left:.4rem;padding:.1rem .4rem;border-radius:999px;background:#000;color:#fff;font-size:.8rem;min-width:1.2rem;text-align:center}
    .audio-toggle{
      border:1px solid #000;
      background:#fff;
      color:#000;
      padding:.45rem .75rem;
      font-size:.9rem;
      cursor:pointer;
    }
    .audio-toggle[aria-pressed="true"]{
      background:#000;
      color:#fff;
    }
    .audio-toggle:focus{
      outline:2px solid #111;
      outline-offset:2px;
    }
    .wrap{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:calc(100vh - 64px)}
    aside{
      border-right:1px solid #000;
      padding:12px;
      position:sticky;
      top:64px;
      align-self:start;
      height:calc(100vh - 64px);
      overflow:auto;
      background:#fff;
      color:#000;
    }
    main{padding:clamp(12px,2vw,24px);background:#fff;color:#000}
    .toc a{
      display:block;
      padding:10px 12px;
      text-decoration:none;
      color:#000;
      line-height:1.15;
      border-bottom:1px solid #000;
    }
    .toc a:hover{background:#000;color:#fff}
    .toc a.active{background:#000;color:#fff}
    #chapterTitle{margin:.2rem 0 0.6rem 0;font-size:1.3rem;color:#000}
    pre{
      white-space:pre-wrap;
      word-wrap:break-word;
      background:#fff;
      border:1px solid #000;
      padding:16px;
      font-size:0.96rem;
      line-height:1.45;
      color:#000;
    }
    #reviewPanel{
      display:none;
      margin-top:12px;
      padding:.75rem;
      border:1px solid #000;
      background:#fff;
      color:#000;
    }
    #navFab{
      position:fixed;
      right:16px;
      top:96px;
      z-index:1000;
      padding:.6rem .85rem;
      border:1px solid #000;
      background:#000;
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }
    #navFab:focus{outline:2px solid #111; outline-offset:2px}
    @media (max-width: 900px){
      .wrap{grid-template-columns:1fr}
      aside{
        position:fixed;
        inset:auto 0 0 0;
        top:0;
        height:100vh;
        width:80vw;
        max-width:420px;
        transform:translateX(-100%);
        transition:transform .2s ease;
        box-shadow:0 0 0 9999px rgba(0,0,0,.25);
        z-index:50
      }
      body.nav-open aside{transform:none}
    }
    /* Modal für TODO-Liste */
    .modal-overlay{
      display:none;
      position:fixed;
      top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.5);
      z-index:2000;
      justify-content:center;
      align-items:center;
    }
    .modal-overlay.active{display:flex}
    .modal-box{
      background:#fff;
      border:2px solid #000;
      max-width:90vw;
      max-height:80vh;
      width:500px;
      display:flex;
      flex-direction:column;
    }
    .modal-header{
      padding:12px 16px;
      border-bottom:1px solid #000;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:600;
    }
    .modal-close{
      background:none;
      border:none;
      font-size:1.5rem;
      cursor:pointer;
      padding:0 4px;
    }
    .modal-body{
      padding:16px;
      overflow-y:auto;
      flex:1;
    }
    .todo-item{
      padding:10px 0;
      border-bottom:1px solid #ddd;
    }
    .todo-item:last-child{border-bottom:none}
    .todo-item .chapter{font-size:0.85rem;color:#666;margin-bottom:4px}
    .todo-item .text{line-height:1.4}
    .todo-item .prio-high{color:#d32f2f;font-weight:600}
    .todo-item .sync-status{font-size:0.8rem;color:#888;margin-top:4px}
  </style>
</head>
<body>
<header>
  <h1>Musik Koffer – Workbench</h1>
  <div id="status">Bereit. Kapitel wählen …</div>
  <div id="todoStats" style="font-size:0.9rem;color:#666;margin-left:auto;">
    <span id="todoPendingCount" style="background:#ff9800;color:#fff;padding:0.2rem 0.6rem;border-radius:12px;font-weight:600;">0 offen</span>
    <span id="todoProcessedCount" style="margin-left:0.5rem;color:#4caf50;font-weight:600;">0 bearbeitet</span>
  </div>
  <div id="err"></div>
  <div class="toolbar">
    <button id="btnListTodos">📋 TODOs anzeigen</button>
    <button id="btnProcessTodos" title="Exportiert TODOs als JSON-Datei für Claude">🤖 TODOs exportieren</button>
    <button id="bgLoopToggle" type="button" class="audio-toggle" aria-pressed="false" hidden>🔊 Musik starten</button>
  </div>
</header>
<div id="progressBar" style="display:none;position:fixed;top:64px;left:0;right:0;height:4px;background:#e0e0e0;z-index:1000;">
  <div id="progressBarFill" style="height:100%;width:0%;background:#4caf50;transition:width 0.3s ease;"></div>
</div>
<button id="navFab" aria-expanded="false" aria-controls="nav">☰ Inhalt</button>
<div class="wrap">
  <aside id="nav" aria-label="Inhaltsverzeichnis">
    <div id="toc" class="toc">Manifest wird geladen …</div>
  <audio id="bgLoop"
         src="Freude2025.wav"
         preload="auto"
         loop
         playsinline
         hidden></audio>
  
  </aside>
  <main>
    <h2 id="chapterTitle">Kapitel</h2>
    <div id="todoInputPanel" style="display:none; margin-bottom:1rem; padding:1rem; border:1px solid #000; background:#f9f9f9;">
      <h3 style="margin:0 0 0.5rem 0; font-size:1rem;">✏️ TODO für dieses Kapitel hinzufügen</h3>
      <textarea id="todoInput" placeholder="Beschreibe was in diesem Kapitel fehlt oder verbessert werden soll..."
                style="width:100%; height:80px; padding:0.5rem; border:1px solid #000; font-family:inherit; font-size:0.9rem;"></textarea>
      <div style="margin-top:0.5rem; display:flex; gap:0.5rem; align-items:center;">
        <label style="font-size:0.9rem;">
          <input type="checkbox" id="todoHighPriority"> Hoch-Priorität
        </label>
        <input type="text" id="todoCategory" placeholder="Kategorie (optional)"
               style="flex:1; padding:0.4rem; border:1px solid #000; font-size:0.9rem;">
        <button id="btnAddTodo" style="padding:0.5rem 1rem; background:#000; color:#fff; border:none; cursor:pointer; font-weight:600;">
          TODO speichern
        </button>
      </div>
      <div id="todoSuccess" style="display:none; margin-top:0.5rem; padding:0.5rem; background:#e8f5e9; border:1px solid #4caf50; color:#2e7d32;">
        ✓ TODO gespeichert! Claude wird es beim nächsten /process-todos verarbeiten.
      </div>
    </div>
    <pre id="chapterContent">Bitte Kapitel im Inhaltsverzeichnis wählen…</pre>
    <div id="reviewPanel"></div>
  </main>
</div>
<script>
  window.WORKFLOW_CONFIG = {
    manifestUrl: 'https://stickysmart.github.io/MusikKoffer/manifest.json'
  };
</script>
<script src="scripts/apply-json.js"></script>
<script src="scripts/json1-handler.js"></script>
<script src="scripts/json2-handler.js"></script>
<script src="scripts/workflow-loader.js"></script>
<script src="scripts/todo-handler.js"></script>

<!-- TODO Modal -->
<div id="todoModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span id="todoModalTitle">TODOs</span>
      <button class="modal-close" onclick="document.getElementById('todoModal').classList.remove('active')">&times;</button>
    </div>
    <div class="modal-body" id="todoModalBody">
      <!-- Inhalt wird dynamisch gefüllt -->
    </div>
  </div>
</div>
</body>
</html>
